name: CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in cli/package.json to npm
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: opencrawl-cli-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bun install --cwd cli --frozen-lockfile --ignore-scripts
      - run: bun run --cwd cli typecheck
      - run: bun cli/scripts/build.ts
      - run: bun cli/scripts/publish.ts --dry-run
      - run: tar -czf cli-dist.tgz -C cli dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-dist-${{ github.sha }}
          path: cli-dist.tgz
          compression-level: 0
          retention-days: 1
  checks:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --cwd cli --frozen-lockfile --ignore-scripts
      - run: bun run --cwd cli typecheck
      - run: bun test cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-${{ github.sha }}
      - run: tar -xzf cli-dist.tgz -C cli
      - run: bun cli/scripts/smoke.ts
      - run: bun cli/scripts/update-smoke.ts
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, checks]
    runs-on: macos-15
    timeout-minutes: 50
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-${{ github.sha }}
      - run: tar -xzf cli-dist.tgz -C cli
      - run: bun cli/scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
