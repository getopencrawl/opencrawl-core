name: CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in cli/package.json to npm
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: opencrawl-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: bun install --cwd cli --frozen-lockfile --ignore-scripts
      - run: bun run --cwd cli typecheck
      - run: bun cli/scripts/build.ts
      - run: bun cli/scripts/publish.ts --dry-run
      - run: tar -czf cli-dist.tgz -C cli dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-dist-${{ github.sha }}
          path: cli-dist.tgz
          compression-level: 0
          retention-days: 1
  checks:
    name: checks (${{ matrix.os }})
    needs: build
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, runner: blacksmith-4vcpu-ubuntu-2404}
          - {os: macos-15, runner: blacksmith-6vcpu-macos-15}
          - {os: windows-2025, runner: blacksmith-4vcpu-windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: bun install --cwd cli --frozen-lockfile --ignore-scripts
      - run: bun run --cwd cli typecheck
      - run: bun test cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-${{ github.sha }}
      - run: tar -xzf cli-dist.tgz -C cli
      - run: bun cli/scripts/smoke.ts
      - run: bun cli/scripts/update-smoke.ts
      - name: Capture ownership under non-reaping PID 1
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror cli/scripts/process-ownership-init.c -o "$RUNNER_TEMP/process-ownership-init"
          sudo unshare --fork --pid --mount-proc "$RUNNER_TEMP/process-ownership-init" "$(command -v node)" "$PWD/cli/scripts/process-ownership.mts" "$PWD/cli/dist"
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, checks]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 50
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      # OIDC dist-tag support is newer than Node 24's bundled npm.
      - run: npm install --global npm@11.21.2 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-${{ github.sha }}
      - run: tar -xzf cli-dist.tgz -C cli
      - run: bun cli/scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
