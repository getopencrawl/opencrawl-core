name: CLI
on:
  push:
    branches: [main]
    paths: ['cli/**', 'plugins/opencrawl-sessions/**', 'src/search/suggestion-events.mts', 'src/sessions/plugin-release.mts', 'tools/delivery.mts', 'tools/validated-tree.mts', '.github/workflows/cli.yml', '.github/workflows/cli-native.yml']
  pull_request:
    paths: ['cli/**', 'plugins/opencrawl-sessions/**', 'src/search/suggestion-events.mts', 'src/sessions/plugin-release.mts', 'tools/delivery.mts', 'tools/validated-tree.mts', '.github/workflows/cli.yml', '.github/workflows/cli-native.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in cli/package.json as native downloads and npm packages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cli-request-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    name: Native CLI
    uses: ./.github/workflows/cli-native.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
    with:
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
  publish:
    needs: native
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    # Only npm writers share this queue. A later native release can ship while
    # npm scans this release. Queue every validated version in arrival order.
    concurrency:
      group: opencrawl-cli-npm-publish
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      # OIDC dist-tag support is newer than Node 24's bundled npm.
      - run: npm install --global npm@11.21.2 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-${{ github.sha }}
      - run: tar -xzf cli-dist.tgz -C cli
      - run: bun cli/scripts/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
