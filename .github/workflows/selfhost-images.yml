name: Staging Helm candidate images
on:
  push:
    branches: [codex/helm-v1-eks-candidate]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-helm-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::017535066453:role/opencrawl-helm-validation-images-20261115
          aws-region: us-east-1
          allowed-account-ids: '017535066453'
          role-duration-seconds: 3600
      - name: Sign in to disposable staging ECR
        run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 017535066453.dkr.ecr.us-east-1.amazonaws.com
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build cleared persistence and Helm runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: 017535066453.dkr.ecr.us-east-1.amazonaws.com/opencrawl-helm-validation/runtime:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime-amd64
          cache-to: type=gha,scope=helm-validation-runtime,mode=max
      - name: Build matching GitHub connector
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: connectors/github
          platforms: linux/amd64
          push: true
          tags: 017535066453.dkr.ecr.us-east-1.amazonaws.com/opencrawl-helm-validation/github:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=github-amd64
          cache-to: type=gha,scope=helm-validation-github,mode=max
