name: Self-host images
on:
  workflow_dispatch:
  push:
    branches: [main, codex/helm-v1]
    # Stable installer releases also need both public images pinned to their source SHA.
    paths: ['src/**', 'web/**', 'web-v2/**', 'connectors/**', 'deploy/**', 'dev/**', '!dev/README.md', 'tools/**', 'package*.json', 'tsconfig.json', '.github/workflows/selfhost-images.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: selfhost-images-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404}
          - {arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the shared API and worker runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/getopencrawl/opencrawl-core:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/getopencrawl/opencrawl-core
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            REVISION=${{ github.sha }}
            OPENCRAWL_SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max
      - name: Build the GitHub Airbyte connector
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: connectors/github
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/getopencrawl/source-github:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/getopencrawl/opencrawl-core
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=github-${{ matrix.arch }}
          cache-to: type=gha,scope=github-${{ matrix.arch }},mode=max
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-architecture image references
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in opencrawl-core source-github; do
            ref="ghcr.io/getopencrawl/$image:sha-$REVISION"
            docker buildx imagetools create --tag "$ref" "$ref-amd64" "$ref-arm64"
            docker buildx imagetools inspect "$ref" >> "$GITHUB_STEP_SUMMARY"
          done
