name: Private core package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
          scope: '@1patch'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Record the source revision in the package
        run: node -e 'require("fs").writeFileSync("revision.json", JSON.stringify({revision:process.env.GITHUB_SHA})+"\n")'
      - name: Publish privately
        run: |
          npm pack --json > package-artifact.json
          archive=$(node -p "require('./package-artifact.json')[0].filename")
          npm publish "$archive" --access restricted
          npm view "@1patch/opencrawl-core@$(node -p "require('./package.json').version")" version dist --json > package-metadata.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-package-${{ github.sha }}
          path: |
            1patch-opencrawl-core-*.tgz
            package-metadata.json
          retention-days: 14
