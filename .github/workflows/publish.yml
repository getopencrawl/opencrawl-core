name: Private core package
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/core-shell-seam'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
          scope: '@getopencrawl'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm ci --prefix web-v2 --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix web-v2
      - name: Validate stable or isolated candidate publication
        id: publication
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          const stable=process.env.GITHUB_REF==='refs/heads/main';
          if(stable ? !/^\d+\.\d+\.\d+$/.test(version) : !/^\d+\.\d+\.\d+-seam\.\d+$/.test(version))
            throw new Error('Stable and candidate versions must use separate release channels');
          appendFileSync(process.env.GITHUB_OUTPUT,`tag=${stable?'latest':'seam'}\n`);
          JS
      - name: Record the source revision in the package
        run: node -e 'require("fs").writeFileSync("revision.json", JSON.stringify({revision:process.env.GITHUB_SHA})+"\n")'
      - name: Publish privately
        run: |
          npm pack --json > package-artifact.json
          archive=$(node -p "require('./package-artifact.json')[0].filename")
          npm publish "$archive" --access restricted --tag "$PACKAGE_TAG"
          npm view "@getopencrawl/opencrawl-core@$(node -p "require('./package.json').version")" version dist --json > package-metadata.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ steps.publication.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-package-${{ github.sha }}
          path: |
            getopencrawl-opencrawl-core-*.tgz
            package-metadata.json
          retention-days: 14
