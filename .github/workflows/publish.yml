name: Private core package
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional full mainline SHA to publish on the isolated revision channel'
        required: false
        type: string
      stable_tag:
        description: 'Optional existing stable v<version> tag on main to publish when main has advanced'
        required: false
        type: string
      cli_version:
        description: 'Optional already-published CLI version for a revision release'
        required: false
        type: string
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: core-package-${{ inputs.revision || 'stable' }}
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: capture-test
          POSTGRES_DB: capture_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:capture-test@127.0.0.1:5432/capture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the tagged stable source on main
        if: inputs.stable_tag != ''
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
          REVISION: ${{ inputs.revision }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          test -z "$REVISION" && test -z "$CLI_VERSION" || exit 1
          [[ "$STABLE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source=$(git rev-parse --verify "refs/tags/${STABLE_TAG}^{commit}")
          git merge-base --is-ancestor "$source" "$GITHUB_SHA"
          newest=$(git tag --merged "$GITHUB_SHA" --sort=-v:refname --list 'v[0-9]*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}')
          test "$STABLE_TAG" = "$newest"
          git checkout --detach "$source"
          test "$STABLE_TAG" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
          scope: '@getopencrawl'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Select a checked immutable source
        id: source
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          SELECTED_CLI_VERSION: ${{ inputs.cli_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/tools/publish-revision.mjs
      # A historical source must not ship tools compiled from the workflow head.
      - run: rm -rf dist
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm ci --prefix web-v2 --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix web-v2
      - name: Prepare the tested source for immutable publication
        if: inputs.revision != ''
        env:
          RELEASE_CLI_VERSION: ${{ steps.source.outputs.cli_version }}
        # Test the unmodified source first. npm pack rebuilds generated release pins.
        run: node tools/delivery.mts prepare
      - name: Validate stable or isolated candidate publication
        id: publication
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {checksPassed} from './deploy/helm/release.mts';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          const stable=process.env.GITHUB_REF==='refs/heads/main';
          if(process.env.REQUESTED_REVISION) {
            if(!stable || !/^\d+\.\d+\.\d+-cd\.[1-9]\d*\.g[a-f0-9]{12}$/.test(version)) throw new Error('Invalid revision publication');
            appendFileSync(process.env.GITHUB_OUTPUT,'tag=revision\n');
            process.exit(0);
          }
          if(!stable || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Stable versions require main');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const revision=git('rev-parse','HEAD');
          if(git('rev-parse',`refs/tags/v${version}^{commit}`)!==revision) throw new Error('Stable packages require a matching immutable v tag on main');
          const repository=process.env.GITHUB_REPOSITORY;
          const response=await fetch(`https://api.github.com/repos/${repository}/actions/runs?head_sha=${revision}&event=push&branch=main&per_page=100`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
          if(!response.ok) throw new Error('Cannot verify stable release gates');
          const runs=await response.json();
          if(runs.total_count>100 || !checksPassed(runs.workflow_runs,revision,repository)) throw new Error('Stable packages require all distribution gates');
          appendFileSync(process.env.GITHUB_OUTPUT,'tag=latest\n');
          JS
      - name: Publish verified multi-platform images under the stable core version
        if: steps.publication.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: node deploy/helm/tag-stable-images.mts
      - name: Record the source revision in the package
        if: inputs.revision == ''
        run: node -e 'require("fs").writeFileSync("revision.json", JSON.stringify({revision:require("child_process").execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim()})+"\n")'
      - name: Publish privately
        run: |
          npm pack --json > package-artifact.json
          archive=$(node -p "require('./package-artifact.json')[0].filename")
          npm publish "$archive" --access restricted --tag "$PACKAGE_TAG"
          npm view "@getopencrawl/opencrawl-core@$(node -p "require('./package.json').version")" version dist --json > package-metadata.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TAG: ${{ steps.publication.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-package-${{ steps.source.outputs.revision }}
          path: |
            getopencrawl-opencrawl-core-*.tgz
            package-metadata.json
          retention-days: 14
