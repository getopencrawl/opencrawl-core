name: Windows native release probe
on: pull_request
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-dist-182cc8333713329083a0f508ed0e50c7681670c2
          run-id: 44246190981
          github-token: ${{ github.token }}
      - name: Inspect the already built Windows binary
        shell: pwsh
        run: |
          tar -xzf cli-dist.tgz dist/win32-x64 dist/cli
          $binary=(Resolve-Path dist/win32-x64/bin/opencrawl.exe).Path
          $expected=(Get-Content dist/win32-x64/package.json | ConvertFrom-Json).version
          Write-Host "Manifest version $expected"
          Get-Item $binary | Select-Object Name,Length
          foreach ($option in @('--version','--help','status')) {
            $out=& $binary $option 2>&1 | Out-String
            Write-Host "Argument $option exit $LASTEXITCODE length $($out.Length)"
            Write-Host ($out.Substring(0,[Math]::Min(450,$out.Length)) | ConvertTo-Json -Compress)
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Compare native entry naming
        working-directory: source
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          bun install --cwd cli --frozen-lockfile --ignore-scripts
          $entry=Join-Path $pwd 'cli/src/cli.ts'
          $body=[IO.File]::ReadAllText($entry)
          $body=$body.Replace('if (import.meta.main) {','console.error("entry",import.meta.main,process.argv.slice(0,3)); if (import.meta.main) {')
          [IO.File]::WriteAllText($entry,$body)
          @'
          import {resolve} from 'node:path';
          for(const [key,naming] of [['extensionless','[name]'],['exe','[name].exe'],['standard',undefined]]) {
            const result=await Bun.build({entrypoints:[resolve('cli/src/cli.ts')],target:'bun',minify:true,jsx:{runtime:'automatic',development:false},define:{OPENCRAWL_VERSION:'"0.4.63"','process.env.NODE_ENV':'"production"','process.env.DEV':'"false"'},...(naming?{naming}:{}),compile:{target:'bun-windows-x64-baseline',outfile:resolve(key+'.exe')}});
            if(!result.success)throw new AggregateError(result.logs,'probe build failed');
            const run=Bun.spawnSync([resolve(key+'.exe'),'--version'],{stdout:'pipe',stderr:'pipe'});
            console.log('VARIANT',key,JSON.stringify({status:run.exitCode,out:run.stdout.toString().slice(0,250),err:run.stderr.toString().slice(0,350)}));
          }
          '@ | Set-Content diagnose.mts
          bun diagnose.mts
