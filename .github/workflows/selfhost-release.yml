name: Release self-host kit
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Tested full mainline SHA to release'
        required: true
        type: string
      version:
        description: 'Next minor or major version, e.g. 0.2.0 or 1.0.0 (patches are automatic)'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: helm-releases
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Release control code comes from trusted main; the packaged source is
      # checked out separately only after exact-revision CI has passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify release policy
        run: node --test deploy/helm/release.test.mts
      - name: Select the next version after all exact-source checks pass
        id: plan
        run: node deploy/helm/release.mts plan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.plan.outputs.action == 'publish'
        with:
          ref: ${{ steps.plan.outputs.revision }}
          path: release-source
          persist-credentials: false
      - name: Install verified Helm
        if: steps.plan.outputs.action == 'publish'
        run: |
          curl -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo '896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          echo /tmp/linux-amd64 >> "$GITHUB_PATH"
      - name: Verify chart contracts
        if: steps.plan.outputs.action == 'publish'
        env:
          AIRBYTE_CHART: /tmp/airbyte.tgz
        run: |
          curl -fsSLo "$AIRBYTE_CHART" https://airbytehq.github.io/charts/airbyte-2.4.0.tgz
          echo 'ec25fcddc952dbef05183f426149553f78db0f7e61642c9d13c77e32c93433a3  /tmp/airbyte.tgz' | sha256sum -c -
          node --test release-source/deploy/helm/test.mts
      - name: Pin public image digests and package
        if: steps.plan.outputs.action == 'publish'
        env:
          REVISION: ${{ steps.plan.outputs.revision }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: node deploy/helm/release-kit.mts --source release-source/deploy/helm --revision "$REVISION" --version "$VERSION" --out artifacts
      - name: Verify anonymous image pulls on both architectures
        if: steps.plan.outputs.action == 'publish'
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          runtime=$(node -p 'const r=require("./artifacts/release.json"); r.image.repository+"@"+r.image.digest')
          connector=$(node -p 'const r=require("./artifacts/release.json"); r.githubConnector.repository+"@"+r.githubConnector.digest')
          for platform in linux/amd64 linux/arm64; do
            for image in "$runtime" "$connector"; do
              docker pull --platform "$platform" "$image"
              test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$platform"
              # The classic Docker store cannot bind one index digest to both architectures.
              # Remove this verified local image before pulling the next platform.
              docker image rm "$image"
            done
          done
      - name: Publish complete assets and verify anonymous downloads
        if: steps.plan.outputs.action != 'skip'
        run: node deploy/helm/release.mts publish
