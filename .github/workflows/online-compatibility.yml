name: Published online compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  production-adapter:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: compatibility-test
          POSTGRES_DB: compatibility_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
          scope: '@getopencrawl'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Fetch and verify the exact published production adapter
        id: legacy
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node tools/online-compatibility.mts .online-compatibility
      - name: Exercise published adapter with actual PostgreSQL journal
        env:
          OPENCRAWL_ONLINE_COMPATIBILITY_DIR: .online-compatibility
          OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:compatibility-test@127.0.0.1:5432/compatibility_test
        run: node --test test/online-compatibility.test.mjs
      - name: Retain verified package and bounded compatibility receipt
        if: always() && steps.legacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: online-compatibility-${{ github.sha }}
          path: |
            .online-compatibility/legacy-core-428.tgz
            .online-compatibility/verified.json
            .online-compatibility/test-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
