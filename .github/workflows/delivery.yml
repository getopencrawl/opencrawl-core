name: Core continuous delivery
on:
  workflow_run:
    workflows: [Core CI, Repository security, Plugin packages]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: core-continuous-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      # Evaluate current main; late callbacks cannot publish superseded source.
      SOURCE_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          registry-url: https://npm.pkg.github.com
          scope: '@getopencrawl'
      - name: Require runtime checks and the declared released CLI
        id: gate
        run: node tools/delivery.mts gate
      - name: Prepare an immutable source-bound version
        if: steps.gate.outputs.ready == 'true'
        id: package
        env:
          RELEASE_CLI_VERSION: ${{ steps.gate.outputs.cli_version }}
        run: node tools/delivery.mts prepare
      - name: Reuse a completed immutable publication
        if: steps.gate.outputs.ready == 'true'
        id: existing
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@getopencrawl/opencrawl-core@$VERSION" --json > metadata.json 2> registry-error.txt; then
            node tools/package-provenance.mts metadata.json "$VERSION" "$SOURCE_REVISION"
            echo 'published=true' >> "$GITHUB_OUTPUT"
            node --input-type=commonjs -e 'console.log("current=" + (require("./metadata.json")["dist-tags"]?.continuous === process.env.VERSION))' >> "$GITHUB_OUTPUT"
          else
            grep -q E404 registry-error.txt
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.existing.outputs.published == 'false'
      - run: npm ci --prefix web-v2 --ignore-scripts --no-audit --no-fund
        if: steps.existing.outputs.published == 'false'
      - name: Publish or resume the exact tested source
        if: steps.existing.outputs.published == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          npm publish --access restricted --tag continuous-pending
      - name: Retain the published artifact and registry integrity
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.current != 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir published-artifact
          npm view "@getopencrawl/opencrawl-core@$VERSION" version dist --json > published-artifact/package-metadata.json
          npm pack "@getopencrawl/opencrawl-core@$VERSION" --ignore-scripts --json --pack-destination published-artifact > published-artifact/package-artifact.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.current != 'true'
        with:
          name: core-package-${{ env.SOURCE_REVISION }}
          path: published-artifact/
          retention-days: 14
      - name: Recheck main before advancing the continuous channel
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.current != 'true'
        id: promote
        run: node tools/delivery.mts gate
      - name: Promote tested package for hosted consumption
        if: steps.promote.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          npm dist-tag add "@getopencrawl/opencrawl-core@$VERSION" continuous
          printf 'Advanced the continuous channel to %s from %s.\n' "$VERSION" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Create a cloud-scoped release notification token
        if: steps.promote.outputs.ready == 'true' && github.repository == 'getopencrawl/opencrawl-core'
        id: cloud-dispatch
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CLOUD_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLOUD_DISPATCH_APP_PRIVATE_KEY }}
          owner: getopencrawl
          repositories: OpenCrawl
          permission-actions: write
      - name: Notify cloud of the published release
        if: steps.promote.outputs.ready == 'true' && github.repository == 'getopencrawl/opencrawl-core'
        env:
          GH_TOKEN: ${{ steps.cloud-dispatch.outputs.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          jq -n --arg version "$VERSION" --arg revision "$SOURCE_REVISION" \
            '{ref:"main", inputs:{core_version:$version, core_revision:$revision}}' > notification.json
          curl --silent --show-error --fail-with-body --max-time 30 --retry 3 --retry-connrefused \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/json' \
            --data-binary @notification.json \
            https://api.github.com/repos/getopencrawl/OpenCrawl/actions/workflows/core-delivery.yml/dispatches
