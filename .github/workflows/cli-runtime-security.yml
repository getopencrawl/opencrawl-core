name: Published CLI runtime inspection
on:
  pull_request:
    paths: ['tools/cli-runtime/**', '.github/workflows/cli-runtime-security.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect exact published native artifact without product authentication
        run: python3 tools/cli-runtime/published.py --architecture '${{ matrix.arch }}' --output cli-runtime-observation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-runtime-${{ matrix.arch }}
          path: cli-runtime-observation.json
          if-no-files-found: error
