name: Core CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify the standalone GitHub connector
        run: python3 -m unittest discover -s connectors/github/tests
      - run: npm ci --prefix web-v2 --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix web-v2
      - name: Install browser for UI regression coverage
        run: npx --prefix web-v2 playwright install --with-deps chromium
      - run: npm run test:browser --prefix web-v2
      - name: Verify every connector manifest on the pinned declarative runtime
        run: OPENCRAWL_TEST_CONNECTOR_RUNTIME=1 node --test test/connector-runtime.test.mjs
      - name: Verify real Temporal scheduling, retries and replay
        run: OPENCRAWL_TEST_TEMPORAL=1 node --test test/session-temporal.test.mjs test/session-deletion-temporal.test.mjs test/slack-source-temporal.test.mjs test/connector-pagination-temporal.test.mjs
      - name: Verify capture against S3-compatible storage
        env:
          OPENCRAWL_TEST_S3_ENDPOINT: http://127.0.0.1:18333
          OPENCRAWL_TEST_OPENSEARCH_URL: http://127.0.0.1:19200
        run: |
          docker run -d --name capture-s3-test --tmpfs /data:size=256m -p 127.0.0.1:18333:8333 \
            -e AWS_ACCESS_KEY_ID=capture-test -e AWS_SECRET_ACCESS_KEY=capture-test-secret \
            chrislusf/seaweedfs:4.52 mini -dir=/data -bucket=capture-test -admin.password=capture-test-secret \
            -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
          docker run -d --name capture-search-test --memory 2g --tmpfs /usr/share/opensearch/data:uid=1000,gid=1000,size=256m -p 127.0.0.1:19200:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e node.store.allow_mmap=false -e 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' \
            opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
          node --input-type=module <<'JS'
          import {createObjectStore} from './dist/src/sessions/s3-store.mjs';
          const store = createObjectStore({
            endpoint: process.env.OPENCRAWL_TEST_S3_ENDPOINT,
            bucket: 'capture-test',
            credentials: {accessKeyId: 'capture-test', secretAccessKey: 'capture-test-secret'},
          });
          for (let attempt = 0; ; attempt++) {
            try { await store.checkAccess(); break; }
            catch (error) {
              if (attempt === 59) throw error;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }
          for (let attempt = 0; ; attempt++) {
            try {
              const response = await fetch(process.env.OPENCRAWL_TEST_OPENSEARCH_URL + '/_cluster/health?wait_for_status=yellow&timeout=1s', {signal: AbortSignal.timeout(3000)});
              if (!response.ok || (await response.json()).timed_out) throw new Error('Test search service is not ready');
              break;
            } catch (error) {
              if (attempt === 59) throw error;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }
          JS
          node --test test/search-adapter-conformance.test.mjs test/session-object-store.test.mjs test/session-indexer.test.mjs test/session-projection.test.mjs test/recent-sessions.test.mjs test/library-live.test.mjs test/session-deletion-live.test.mjs test/connector-live.test.mjs test/connector-write-barrier-live.test.mjs test/board-search-live.test.mjs test/realm-live.test.mjs test/workspace-search-live.test.mjs test/search-quality-live.test.mjs test/memory-live.test.mjs test/memory-projection-live.test.mjs
      - name: Remove disposable object store
        if: always()
        run: docker rm -f capture-s3-test capture-search-test || true
