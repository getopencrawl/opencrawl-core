name: Core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  validation:
    name: Find exact tested core source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Verify prior validation of the identical merged tree
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/validated-tree.mts
  unit:
    needs: validation
    if: needs.validation.outputs.reuse != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: capture-test
          POSTGRES_DB: capture_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:capture-test@127.0.0.1:5432/capture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify the standalone GitHub connector
        run: python3 -m unittest discover -s connectors/github/tests
      - name: Verify real Temporal scheduling, retries and replay
        run: OPENCRAWL_TEST_TEMPORAL=1 node --test test/session-temporal.test.mjs test/session-deletion-temporal.test.mjs test/slack-source-temporal.test.mjs test/connector-pagination-temporal.test.mjs test/connector-maintenance-temporal.test.mjs test/team-temporal.test.mjs test/integration-command-temporal.test.mjs test/connector-count-temporal.test.mjs
  web:
    needs: validation
    if: needs.validation.outputs.reuse != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: capture-test
          POSTGRES_DB: capture_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:capture-test@127.0.0.1:5432/capture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm ci --prefix web-v2 --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix web-v2
      - name: Verify the package contains the compiled self-host console
        run: node tools/package-contents.mts
      - name: Install browser for UI regression coverage
        run: npx --prefix web-v2 playwright install --with-deps chromium
      - run: npm run test:browser --prefix web-v2
  integration:
    needs: validation
    if: needs.validation.outputs.reuse != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: capture-test
          POSTGRES_DB: capture_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:capture-test@127.0.0.1:5432/capture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify every connector manifest on the pinned declarative runtime
        run: OPENCRAWL_TEST_CONNECTOR_RUNTIME=1 node --test test/connector-runtime.test.mjs
      - name: Verify capture against S3-compatible storage
        env:
          OPENCRAWL_TEST_S3_ENDPOINT: http://127.0.0.1:18333
          OPENCRAWL_TEST_OPENSEARCH_URL: http://127.0.0.1:19200
        run: |
          docker run -d --name capture-s3-test --tmpfs /data:size=256m -p 127.0.0.1:18333:8333 \
            -e AWS_ACCESS_KEY_ID=capture-test -e AWS_SECRET_ACCESS_KEY=capture-test-secret \
            chrislusf/seaweedfs:4.52 mini -dir=/data -bucket=capture-test -admin.password=capture-test-secret \
            -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
          docker run -d --name capture-search-test --memory 2g --tmpfs /usr/share/opensearch/data:uid=1000,gid=1000,size=256m -p 127.0.0.1:19200:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e node.store.allow_mmap=false -e 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' \
            opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
          node --input-type=module <<'JS'
          import {createObjectStore} from './dist/src/sessions/s3-store.mjs';
          const store = createObjectStore({
            endpoint: process.env.OPENCRAWL_TEST_S3_ENDPOINT,
            bucket: 'capture-test',
            credentials: {accessKeyId: 'capture-test', secretAccessKey: 'capture-test-secret'},
          });
          for (let attempt = 0; ; attempt++) {
            try { await store.checkAccess(); break; }
            catch (error) {
              if (attempt === 59) throw error;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }
          for (let attempt = 0; ; attempt++) {
            try {
              const response = await fetch(process.env.OPENCRAWL_TEST_OPENSEARCH_URL + '/_cluster/health?wait_for_status=yellow&timeout=1s', {signal: AbortSignal.timeout(3000)});
              if (!response.ok || (await response.json()).timed_out) throw new Error('Test search service is not ready');
              break;
            } catch (error) {
              if (attempt === 59) throw error;
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }
          JS
          node --test test/session-context.test.mjs test/search-context.test.mjs test/search-adapter-conformance.test.mjs test/session-overlap.test.mjs test/session-object-store.test.mjs test/session-indexer.test.mjs test/session-tokens.test.mjs test/session-projection.test.mjs test/recent-sessions.test.mjs test/library-live.test.mjs test/resource-control-consumers-live.test.mjs test/session-deletion-live.test.mjs test/connector-live.test.mjs test/linear.test.mjs test/connector-write-barrier-live.test.mjs test/board-search-live.test.mjs test/realm-live.test.mjs test/workspace-search-live.test.mjs test/search-quality-live.test.mjs test/memory-live.test.mjs test/sqlite-search.test.mjs
      - name: Measure bulk scheduling and verify large documents
        env:
          OPENCRAWL_TEST_OPENSEARCH_URL: http://127.0.0.1:19200
          OPENCRAWL_BULK_BENCHMARK_OUTPUT: bulk-benchmark.json
        run: node dist/tools/benchmark-bulk.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bulk-benchmark-${{ github.sha }}
          path: bulk-benchmark.json
      - name: Remove disposable object store
        if: always()
        run: docker rm -f capture-s3-test capture-search-test || true
  cli:
    needs: validation
    if: needs.validation.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: capture-test
          POSTGRES_DB: capture_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLI_SHARD: ${{ matrix.shard }}
      OPENCRAWL_TEST_POSTGRES_URL: postgres://postgres:capture-test@127.0.0.1:5432/capture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify CLI consumers of core under Bun
        run: |
          bun install --cwd cli --frozen-lockfile --ignore-scripts
          mapfile -t tests < <(node --input-type=module -e 'import {readdirSync} from "node:fs"; const files=readdirSync("cli/test",{recursive:true}).filter(f=>/\.(test|spec)\.[cm]?[jt]sx?$/.test(f)).sort(); for (const [i,file] of files.entries()) if(i%4===Number(process.env.CLI_SHARD)) console.log("test/"+file)')
          test "${#tests[@]}" -gt 0
          bun run --cwd cli test "${tests[@]}"
  test:
    # Preserve the protected check and require every lane or exact prior proof.
    needs: [validation, unit, web, integration, cli]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Require all runtime checks or exact prior validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          REUSE: ${{ needs.validation.outputs.reuse }}
        run: |
          node --input-type=module <<'JS'
          import {runtimeChecksPassed} from './tools/validated-tree.mts';
          if (!runtimeChecksPassed(JSON.parse(process.env.RESULTS), process.env.REUSE === 'true', process.env.GITHUB_EVENT_NAME)) process.exit(1);
          JS
      - name: Record the source tree that passed every PR check
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/validated-tree.mts record
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'pull_request'
        with:
          name: core-validation
          path: validation.json
          retention-days: 7
