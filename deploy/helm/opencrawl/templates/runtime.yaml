{{- if .Values.runtime.enabled }}
{{- $name := include "opencrawl.name" . }}
{{- if not .Values.sharedFiles.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-git
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.sharedFiles.size | quote }}}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-runtime
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "8092"
  {{- range $key, $value := .Values.runtime.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default $name .Values.serviceAccount.name }}
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
  annotations: {{ toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
---
{{- if .Values.runtime.migrationCommand }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-{{ .Release.Revision }}
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: migration}
    spec:
      {{- include "opencrawl.scheduling" . | nindent 6 }}
      serviceAccountName: {{ default $name .Values.serviceAccount.name }}
      restartPolicy: Never
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "opencrawl.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.runtime.migrationCommand }}
          {{- include "opencrawl.runtimeEnv" . | nindent 10 }}
          {{- include "opencrawl.runtimeMounts" . | nindent 10 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.runtime.appResources | nindent 12 }}
      {{- include "opencrawl.runtimeVolumes" . | nindent 6 }}
---
{{- end }}
{{- range $component := list "app" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels: {{ include "opencrawl.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: opencrawl, app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $component }}}
      annotations:
        checksum/config: {{ $.Values.runtime.env | toJson | sha256sum }}
    spec:
      {{- include "opencrawl.scheduling" $ | nindent 6 }}
      serviceAccountName: {{ default $name $.Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ $.Values.runtime.terminationGracePeriodSeconds }}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      {{- if $.Values.runtime.readinessCommand }}
      initContainers:
        - name: app-state-ready
          image: {{ include "opencrawl.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson $.Values.runtime.readinessCommand }}
          {{- include "opencrawl.runtimeEnv" $ | nindent 10 }}
          {{- include "opencrawl.runtimeMounts" $ | nindent 10 }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "opencrawl.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [node, {{ ternary "dist/src/selfhost/server.mjs" "dist/src/selfhost/worker.mjs" (eq $component "app") }}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          {{- include "opencrawl.runtimeEnv" $ | nindent 10 }}
          {{- include "opencrawl.runtimeMounts" $ | nindent 10 }}
          {{- if eq $component "app" }}
            - {name: shared-files, mountPath: /data/shared-files}
          ports: [{name: http, containerPort: 8092}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 120}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources: {{ toYaml $.Values.runtime.appResources | nindent 12 }}
          {{- else }}
          startupProbe:
            exec: {command: [node, -e, "const s=JSON.parse(require('fs').readFileSync('/tmp/opencrawl-worker-ready.json'));process.exit(Date.now()-Date.parse(s.checkedAt)<65000?0:1)"]}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec: {command: [node, -e, "const s=JSON.parse(require('fs').readFileSync('/tmp/opencrawl-worker-ready.json'));process.exit(Date.now()-Date.parse(s.checkedAt)<65000?0:1)"]}
            periodSeconds: 15
          resources: {{ toYaml $.Values.runtime.workerResources | nindent 12 }}
          {{- end }}
      {{- include "opencrawl.runtimeVolumes" $ | nindent 6 }}
      {{- if eq $component "app" }}
        - name: shared-files
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-git" $name) $.Values.sharedFiles.existingClaim }}
      {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: app}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
  annotations: {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $name }}, port: {name: http}}
{{- end }}
{{- end }}
