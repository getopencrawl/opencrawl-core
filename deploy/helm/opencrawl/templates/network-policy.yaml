{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opencrawl.name" . }}-backends
  labels: {{ include "opencrawl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [postgresql, opensearch, s3, temporal]}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
{{- end }}
