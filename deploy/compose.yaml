# One organization, multiple users. Local Better Auth accounts; bring your own Airbyte workspace.
# Choose a fresh COMPOSE_PROJECT_NAME for each independent installation.
name: ${COMPOSE_PROJECT_NAME:-opencrawl}
x-runtime: &runtime
  build: {context: .., dockerfile: deploy/Dockerfile}
  image: opencrawl-core:${OPENCRAWL_IMAGE_TAG:-local}
  restart: unless-stopped
  stop_grace_period: 45s
  volumes: ["application:/data"]
  environment: &env
    OPENCRAWL_URL: ${OPENCRAWL_URL:?Set the HTTPS application origin}
    OPENCRAWL_ORGANIZATION_ID: ${OPENCRAWL_ORGANIZATION_ID:?Run ./up.sh}
    OPENCRAWL_AUTH_SECRET: ${OPENCRAWL_AUTH_SECRET:?Run ./up.sh}
    OPENCRAWL_SETUP_TOKEN: ${OPENCRAWL_SETUP_TOKEN:?Run ./up.sh}
    OPENCRAWL_IDENTITY_PATH: /data/identity.sqlite
    OPENCRAWL_REGISTRY_PATH: /data/integrations.sqlite
    OPENCRAWL_LANDING_S3_BUCKET: opencrawl
    OPENCRAWL_LANDING_S3_REGION: us-east-1
    OPENCRAWL_LANDING_S3_ENDPOINT: http://s3:8333
    OPENCRAWL_LANDING_S3_ACCESS_KEY_ID: ${OPENCRAWL_S3_ACCESS_KEY_ID:?Run ./up.sh}
    OPENCRAWL_LANDING_S3_SECRET_ACCESS_KEY: ${OPENCRAWL_S3_SECRET_ACCESS_KEY:?Run ./up.sh}
    OPENCRAWL_AIRBYTE_ENABLED: ${OPENCRAWL_AIRBYTE_ENABLED:-true}
    OPENCRAWL_AIRBYTE_S3_ENDPOINT: ${OPENCRAWL_AIRBYTE_S3_ENDPOINT:-}
    OPENCRAWL_AIRBYTE_APP_URL: ${OPENCRAWL_AIRBYTE_APP_URL:-}
    OPENCRAWL_CONNECTOR_KEY: ${OPENCRAWL_CONNECTOR_KEY:?Run ./up.sh}
    AIRBYTE_URL: ${AIRBYTE_URL:-}
    AIRBYTE_CLIENT_ID: ${AIRBYTE_CLIENT_ID:-}
    AIRBYTE_CLIENT_SECRET: ${AIRBYTE_CLIENT_SECRET:-}
    AIRBYTE_WORKSPACE_ID: ${AIRBYTE_WORKSPACE_ID:-}
    AIRBYTE_S3_DESTINATION_DEFINITION_ID: ${AIRBYTE_S3_DESTINATION_DEFINITION_ID:-}
    SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
    SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
    COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    COMPOSIO_BASE_URL: ${COMPOSIO_BASE_URL:-}
    GITHUB_APP: ${GITHUB_APP:-}
    AIRBYTE_GITHUB_REPOSITORY: ${AIRBYTE_GITHUB_REPOSITORY:-opencrawl/source-github}
    AIRBYTE_GITHUB_TAG: ${AIRBYTE_GITHUB_TAG:-local}
    OPENCRAWL_OPENSEARCH_URL: http://opensearch:9200
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_CONNECTOR_TASK_QUEUE: connector-indexing-v1
    TEMPORAL_SESSION_TASK_QUEUE: session-indexing-v1
    TEMPORAL_SESSION_DELETION_TASK_QUEUE: session-deletion-v1

services:
  app:
    <<: *runtime
    command: ["node", "dist/src/selfhost/server.mjs"]
    environment: {<<: *env, HOST: 0.0.0.0, PORT: "8092"}
    ports: ["${OPENCRAWL_APP_BIND:-127.0.0.1}:${OPENCRAWL_APP_PORT:-8092}:8092"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on: {s3: {condition: service_started}, opensearch: {condition: service_healthy}}

  worker:
    <<: *runtime
    command: ["node", "dist/src/selfhost/worker.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('fs').readFileSync('/tmp/opencrawl-worker-ready.json'));process.exit(Date.now()-Date.parse(s.checkedAt)<65000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 30
    depends_on: {app: {condition: service_healthy}, temporal: {condition: service_healthy}}

  s3:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: >-
      mini -dir=/data -bucket=opencrawl -admin.password=${OPENCRAWL_S3_SECRET_ACCESS_KEY}
      -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${OPENCRAWL_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OPENCRAWL_S3_SECRET_ACCESS_KEY}
    volumes: ["s3:/data"]
    # Airbyte jobs must reach this endpoint. Keep loopback unless configuring a private interface.
    ports: ["${OPENCRAWL_S3_BIND:-127.0.0.1}:${OPENCRAWL_S3_PORT:-18333}:8333"]

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:3b55f6b6249cfdb92b52ee59adc8a266203ba9ef9f5d82544fad6f1af2f3609e
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      node.store.allow_mmap: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["opensearch:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      retries: 60

  temporal-db:
    image: postgres:16.6-bookworm
    restart: unless-stopped
    environment: {POSTGRES_USER: temporal, POSTGRES_PASSWORD: "${OPENCRAWL_TEMPORAL_PASSWORD:?Run ./up.sh}"}
    volumes: ["temporal-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${OPENCRAWL_TEMPORAL_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on: {temporal-db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      retries: 60

  backup:
    profiles: [maintenance]
    image: opencrawl-core:${OPENCRAWL_IMAGE_TAG:-local}
    user: root
    entrypoint: []
    volumes: ["s3:/data/s3", "opensearch:/data/opensearch", "temporal-db:/data/temporal-db", "application:/data/application"]

volumes:
  s3:
  opensearch:
  temporal-db:
  application:
