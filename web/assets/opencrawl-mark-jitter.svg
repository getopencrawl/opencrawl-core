<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 320 840 440" fill="none"><title>OpenCrawl</title><style>.c{animation:c 2.4s steps(1,end) infinite}.b{animation:b 2.4s steps(1,end) infinite}@keyframes c{0%{transform:translate(-18px,0)}8%{transform:translate(-22.5px,3px)}16%{transform:translate(-15px,-1.5px)}24%{transform:translate(-21px,1.5px)}32%{transform:translate(-16.5px,-3px)}40%{transform:translate(-22.5px,1.5px)}48%{transform:translate(-15px,1.5px)}56%{transform:translate(-19.5px,-1.5px)}64%{transform:translate(-28.5px,3px)}68%{transform:translate(-13.5px,-3px)}72%{transform:translate(-24px,1.5px)}76%{transform:translate(-19.5px,-1.5px)}84%{transform:translate(-16.5px,1.5px)}92%{transform:translate(-21px,-1.5px)}}@keyframes b{0%{transform:translate(18px,0)}8%{transform:translate(15px,-1.5px)}16%{transform:translate(22.5px,3px)}24%{transform:translate(16.5px,-1.5px)}32%{transform:translate(21px,1.5px)}40%{transform:translate(15px,-3px)}48%{transform:translate(21px,1.5px)}56%{transform:translate(16.5px,1.5px)}64%{transform:translate(27px,-3px)}68%{transform:translate(13.5px,3px)}72%{transform:translate(22.5px,-1.5px)}76%{transform:translate(19.5px,1.5px)}84%{transform:translate(18px,-1.5px)}92%{transform:translate(15px,1.5px)}}@media(prefers-reduced-motion:reduce){.c,.b{animation:none}}</style><defs><path id="oc" fill-rule="evenodd" d="M441 337C521 337 571 372 609 426Q629 456 650 426C691 371 747 337 828 337C908 337 968 377 994 451L922 493C903 451 871 429 828 429C765 429 715 478 715 538C715 599 765 647 828 647C871 647 902 625 922 583L994 625C966 698 907 737 828 737C748 737 692 704 651 652Q630 623 609 652C570 704 520 737 441 737C318 737 224 650 224 538C224 425 318 337 441 337ZM441 431C380 431 332 478 332 538C332 598 380 645 441 645C500 645 548 598 548 538C548 478 500 431 441 431Z"/></defs><use class="c" href="#oc" fill="#ff6268" transform="translate(-12 0)"/><use class="b" href="#oc" fill="#164bff" transform="translate(12 0)"/><use href="#oc" fill="#7d82ff"/></svg>
