# kubectl apply -n airbyte -f secret.yaml   (copy this file; never commit real values)
apiVersion: v1
kind: Secret
metadata:
  name: airbyte-config-secrets
type: Opaque
stringData:
  database-user: airbyte
  database-password: change-me
  s3-access-key-id: change-me
  s3-secret-access-key: change-me
  instance-admin-password: change-me
  # API application credentials for cli.mjs. Use a UUID for the ID and a long random secret.
  instance-admin-client-id: change-me
  instance-admin-client-secret: change-me
  # Signs Airbyte's auth tokens. A long random string, e.g. `openssl rand -hex 32`.
  jwt-signature-secret: change-me
