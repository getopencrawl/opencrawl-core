# Production Airbyte for OpenCrawl: Helm chart V2 with external Postgres and S3.
# Written against airbyte-v2/airbyte 2.4.0: every secretKeyRef the rendered chart
# requires is present in secret.example.yaml. Replace every example.com value,
# create the secret from secret.example.yaml, then:
#
#   helm repo add airbyte-v2 https://airbytehq.github.io/charts
#   helm upgrade --install airbyte airbyte-v2/airbyte --version 2.4.0 \
#     -n airbyte --create-namespace -f values.yaml
global:
  edition: community
  # Must match the ingress host; Airbyte builds OAuth and UI links from it.
  airbyteUrl: https://airbyte.example.com

  database:
    type: external
    secretName: airbyte-config-secrets
    host: airbyte-db.example.com
    port: 5432
    name: airbyte
    userSecretKey: database-user
    passwordSecretKey: database-password
    # The chart always wires a read replica; without these keys it requires
    # CONFIG_DATABASE_REPLICA_USER/PASSWORD and pods fail to start.
    replica:
      userSecretKey: database-user
      passwordSecretKey: database-password

  storage:
    type: s3
    secretName: airbyte-config-secrets
    bucket:
      log: example-airbyte-state
      state: example-airbyte-state
      workloadOutput: example-airbyte-state
      activityPayload: example-airbyte-state
      auditLogging: example-airbyte-state
    s3:
      region: us-east-1
      # Use instanceProfile (IRSA / node role) instead of keys where possible.
      authenticationType: credentials
      accessKeyIdSecretKey: s3-access-key-id
      secretAccessKeySecretKey: s3-secret-access-key

  auth:
    enabled: true
    # The bootloader reads these keys from this secret on install and copies them into
    # the airbyte-auth-secrets secret that the server uses. This fixes the UI password
    # and the API credentials for cli.mjs (AIRBYTE_CLIENT_ID / AIRBYTE_CLIENT_SECRET).
    secretName: airbyte-config-secrets
    instanceAdmin:
      passwordSecretKey: instance-admin-password
      clientIdSecretKey: instance-admin-client-id
      clientSecretSecretKey: instance-admin-client-secret
    security:
      jwtSignatureSecretSecretKey: jwt-signature-secret

  # Airbyte sends anonymous usage data to Segment by default. `logging` keeps it local.
  tracking:
    strategy: logging

# The bundled database is for evaluation only.
postgresql:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: airbyte.example.com
      paths:
        - path: /
          pathType: Prefix
          backend: server
  tls:
    - secretName: airbyte-tls
      hosts: [airbyte.example.com]
